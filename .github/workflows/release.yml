# Publishes a GitHub Release whenever the version in GoonbergTerminal.toc changes.
# On every push to main: read "## Version:" from the .toc; if there's no release for
# that version yet, build GoonbergTerminal-<version>.zip and publish it (this also
# creates the v<version> tag). WowUp and similar managers update from these releases.
# The zip also carries the market data addons (GoonbergData_*) from the `data` branch.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          VERSION=$(sed -n 's/^## Version: *//p' GoonbergTerminal.toc | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check for an existing release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package
        if: steps.exists.outputs.found == 'false'
        run: |
          mkdir -p dist/GoonbergTerminal
          rsync -a --exclude '.*' --exclude 'dist' --exclude 'tools' --exclude 'Markets' ./ dist/GoonbergTerminal/
          # the latest daily market data (from the "Blizzard prices" workflow), if any
          if git ls-remote --exit-code origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD Markets | tar -x -C dist
            cp -r dist/Markets/* dist/ && rm -rf dist/Markets
          fi
          cd dist
          shopt -s nullglob
          zip -qr "GoonbergTerminal-${{ steps.v.outputs.version }}.zip" GoonbergTerminal GoonbergData_*
      - name: Publish release
        if: steps.exists.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          NOTES=$(awk "/^## ${VERSION}\$/{f=1;next} /^## /{f=0} f" CHANGELOG.md)
          gh release create "v${VERSION}" "dist/GoonbergTerminal-${VERSION}.zip" \
            --target "$GITHUB_SHA" --title "Goonberg Terminal ${VERSION}" \
            --notes "${NOTES:-Goonberg Terminal ${VERSION}}"
